name: Installer plan validation

on:
  push:
    branches: [main, 'installer/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate example plan
        run: PYTHONPATH=. python -m deku_installer.cli examples/dry-run-plan.json
